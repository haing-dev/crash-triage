name: raw-closes
on:
  schedule:
    - cron: "11 6 * * *"
  push:
    paths: ["pipeline/raw_closes.py", ".github/workflows/rawcloses.yml"]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: cd pipeline && python raw_closes.py --minutes 300
      - name: Save
        if: always()
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices_raw; [ -f data/state/raw_closes.json ] && git add data/state/raw_closes.json
          git commit -m "raw closes [skip ci]" || echo "no change"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((i*9)); done
