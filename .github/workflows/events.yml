name: read-press-releases
on:
  schedule:
    - cron: "47 */6 * * *"      # every 6 hours; reads the announcement for crashes not yet read
  workflow_dispatch:
    inputs:
      limit: { description: "Crashes to read this run", default: "20" }
permissions:
  contents: write
concurrency:                   # own queue: long jobs don't cancel the hourly ones
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - id: c                      # skip the rest when every crash has been read
        run: echo "n=$(cd pipeline && python3 pending.py events)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.c.outputs.n != '0'
        with: { node-version: "22" }
      - name: Install Claude Code
        if: steps.c.outputs.n != '0'
        run: npm install -g @anthropic-ai/claude-code
      - name: Read announcements
        if: steps.c.outputs.n != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && timeout 50m python events.py --limit ${{ inputs.limit || '20' }} || true
      - name: Save
        if: steps.c.outputs.n != '0'
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/crash/events
          git commit -m "press releases read [skip ci]" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
