name: read-press-releases
on:
  schedule:
    - cron: "47 * * * *"        # hourly; reads the company announcement for crashes not yet read
  workflow_dispatch:
    inputs:
      limit: { description: "Crashes to read this run", default: "40" }
permissions:
  contents: write
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Read announcements
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && python events.py --limit ${{ inputs.limit || '40' }}
      - name: Save
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events
          git commit -m "press releases read [skip ci]" || echo "no change"
          git pull --rebase && git push
