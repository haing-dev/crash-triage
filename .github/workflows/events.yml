name: read-press-releases
on:
  schedule:
    - cron: "47 * * * *"        # hourly; reads the company announcement for crashes not yet read
  workflow_dispatch:
    inputs:
      limit: { description: "Crashes to read this run", default: "150" }
permissions:
  contents: write
concurrency:                   # own queue: long jobs don't cancel the hourly ones
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Read announcements
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && timeout 50m python events.py --limit ${{ inputs.limit || '150' }} || true
      - name: Save
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/crash/events
          git commit -m "press releases read [skip ci]" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
