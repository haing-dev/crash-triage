name: read-liquidity
on:                             # paused: cash runway is no longer a signal, so these Claude reads aren't needed
  workflow_dispatch:
    inputs:
      limit: { description: "Filings to read this run", default: "30" }
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  pending:                       # one cheap check, so the reader doesn't start when nothing is left to read
    runs-on: ubuntu-latest
    outputs:
      n: ${{ steps.c.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: echo "n=$(cd pipeline && python3 pending.py liquidity)" >> "$GITHUB_OUTPUT"
  liquidity:
    needs: pending
    if: needs.pending.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Read filings (one at a time; crashes first, then slides)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          cd pipeline
          timeout 25m python3 liquidity.py --kind crash --limit 10 || true
          timeout 25m python3 liquidity.py --kind slide --limit ${{ inputs.limit || '30' }} || true
      - name: Save
        if: always()
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/*/liquidity || true
          git commit -m "liquidity facts read [skip ci]" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
