name: pipelines-oneoff
on:
  push:
    paths: ["pipeline/pipelines.py", "pipeline/pipeline_list.json"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && python pipelines.py
      - run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/pipelines.json
          git commit -m "pipeline descriptions [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
