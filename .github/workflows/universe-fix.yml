name: universe-fix
on:
  push:
    paths: ["pipeline/universe_fix.py", "pipeline/universe_lib.py", ".github/workflows/universe-fix.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && python universe_fix.py
      - run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.csv
          git commit -m "universe: second pass for missing tickers [skip ci]" || echo "no change"
          git pull --rebase && git push
