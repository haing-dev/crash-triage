name: universe-fix
on:
  schedule:
    - cron: "41 5 1 * *"        # monthly, after the universe refresh
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ${{ github.workflow }}, cancel-in-progress: false }   # own queue: long jobs don't cancel the hourly ones
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && python universe_fix.py
      - run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.csv
          git commit -m "universe: second pass for missing tickers [skip ci]" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
