name: build-universe
on:
  schedule:
    - cron: "11 3 1 * *"        # monthly: picks up new listings; everything else is stored and reused
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-writes, cancel-in-progress: false }
jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build universe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: cd pipeline && python universe.py
      - name: Save
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe.csv reports/universe.md
          git commit -m "universe: rebuild [skip ci]" || echo "no change"
          git pull --rebase && git push
