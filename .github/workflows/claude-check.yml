name: claude-check
on:
  push:
    paths: [".github/workflows/claude-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: One tiny call with the stored token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty"; exit 1; fi
          out=$(claude -p "Reply with exactly: OK" --model sonnet --tools "" 2>&1 | tail -c 300) || true
          echo "::notice::Claude replied: $out"
          echo "$out" | grep -q "OK" || { echo "::error::Claude call failed: $out"; exit 1; }
