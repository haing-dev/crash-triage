name: splits
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:                   # own queue: long jobs don't cancel the hourly ones
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: List all splits (a few calls) and store them
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: cd pipeline && python splits.py
      - name: Save
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/splits
          git commit -m "splits [skip ci]" || echo "no change"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((i*7)); done
