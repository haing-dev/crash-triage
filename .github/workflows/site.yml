name: build-site
on:
  schedule:
    - cron: "23 0,12 * * *"     # twice a day; Cloudflare only deploys the 'site' branch
  push:
    paths: ["web/**", "pipeline/build_site.py", "pipeline/fit.py", "pipeline/common.py", "pipeline/returns.py", "pipeline/controls.py", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: true }
jobs:
  site:
    if: github.ref == 'refs/heads/main'      # only main is published
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - run: cd pipeline && python fit.py && python build_site.py
      - name: Keep the call ledger and the similar-biotech matches; publish new calls as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger.csv data/controls.json data/*/calibration.json reports/fit_*.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "calls and matches [skip ci]"
            for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((i*9)); done
          fi
          if [ -f new_calls.md ]; then
            gh release create "calls-$(date -u +%Y%m%d-%H%M)" --title "Calls $(date -u '+%Y-%m-%d %H:%M UTC')" --notes-file new_calls.md --target main
          fi
      - name: Package for Cloudflare (Worker with static assets)
        run: |
          mkdir -p deploy && mv site deploy/public
          cat > deploy/wrangler.jsonc <<'JSON'
          {
            "name": "crash-triage",
            "compatibility_date": "2026-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": { "directory": "./public", "not_found_handling": "single-page-application" }
          }
          JSON
      - name: Deploy to Cloudflare directly (used once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no Cloudflare token yet: relying on Cloudflare's own build of the 'site' branch"; exit 0; fi
          cd deploy && npx -y wrangler@4 deploy
      - name: Publish to the 'site' branch
        run: |
          cd deploy
          git init -q -b site
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "site build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
# deploy: Actions publishes to Cloudflare with wrangler (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)
