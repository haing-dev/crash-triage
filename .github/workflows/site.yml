name: build-site
on:
  schedule:
    - cron: "23 */3 * * *"      # every 3 hours; Cloudflare only deploys the 'site' branch
  push:
    paths: ["web/**", "pipeline/build_site.py", "pipeline/fit.py", "pipeline/common.py", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: true }
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd pipeline && python fit.py && python build_site.py
      - name: Package for Cloudflare (Worker with static assets)
        run: |
          mkdir -p deploy && mv site deploy/public
          cat > deploy/wrangler.jsonc <<'JSON'
          {
            "name": "crash-triage",
            "compatibility_date": "2026-10-01",
            "workers_dev": true,
            "preview_urls": false,
            "assets": { "directory": "./public", "not_found_handling": "single-page-application" }
          }
          JSON
      - name: Publish to the 'site' branch
        run: |
          cd deploy
          git init -q -b site
          git config user.name "crash-triage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "site build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
